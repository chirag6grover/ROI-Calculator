name: Monthly LLM pricing check

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, any time

permissions:
  contents: write
  pull-requests: write

jobs:
  check-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r pricing-watcher/requirements.txt

      - name: Run pricing check
        id: check
        run: python pricing-watcher/check_pricing.py

      - name: Open a pull request if prices changed
        if: steps.check.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Update LLM pricing snapshot'
          title: 'Monthly pricing check: changes detected'
          body-path: pricing-watcher/pricing-diff-summary.md
          branch: pricing-update-${{ github.run_number }}
          add-paths: |
            pricing-watcher/pricing-data.json
